<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Max the Robot: The Great Number Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout concept: a night-time Number City stage. Max and his speech bubble sit on the left, a bright cream question card on the right with the teacher controls inside it, and the city skyline along the bottom lights up as the class repairs it. */
:root{
  --night:#1b1850; --night-2:#2b2778; --night-3:#403b9c;
  --cream:#fff7e0; --ink:#231a52; --ink-soft:#5a5190;
  --volt:#ffd23f; --teal:#0a9b92; --coral:#f2476a; --grape:#7d4de8; --lime:#5fd568; --sky:#58b6ff;
  --f-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --e:0;
  color-scheme:dark;
  font-size:clamp(15px,.6vw + 10px,22px);
  background:var(--night);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  padding-inline:clamp(16px,2vw,32px);
  font:700 1rem/1.35 var(--f-body);
  color:var(--cream);
  background:radial-gradient(1100px 560px at 15% -10%,#3d38a8 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#5b2f9d66 0,transparent 55%),var(--night);
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.65;
  background-image:radial-gradient(2px 2px at 8% 18%,#fffc,transparent),radial-gradient(2px 2px at 23% 62%,#fff9,transparent),radial-gradient(3px 3px at 41% 12%,#ffe9a8cc,transparent),radial-gradient(2px 2px at 57% 48%,#fff9,transparent),radial-gradient(2px 2px at 72% 22%,#fffc,transparent),radial-gradient(3px 3px at 88% 56%,#ffe9a8cc,transparent),radial-gradient(2px 2px at 95% 12%,#fff9,transparent),radial-gradient(2px 2px at 33% 86%,#fff8,transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--volt);outline-offset:3px}

.app{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding-block:14px 20px;display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px);min-height:100dvh}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 22px}
.brand{display:flex;align-items:center;gap:.5rem;font:700 1.55rem/1 var(--f-display);color:var(--volt);letter-spacing:.01em}
.brand .bolt{width:1.5rem;height:1.5rem;background:var(--volt);clip-path:polygon(58% 0,12% 56%,44% 56%,34% 100%,88% 40%,54% 40%);filter:drop-shadow(0 0 6px #ffd23f)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:.3em .9em;border-radius:99px;font:600 .95rem var(--f-display);background:#ffffff1a;color:#d6d0ff;white-space:nowrap}
.pill.cur{background:var(--volt);color:var(--ink)}
.pill.done{background:var(--lime);color:#0f3d17}
.pill.lock{opacity:.5}
.meters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:min(100%,170px)}
.mlabel{font:600 .85rem var(--f-display);color:#d6d0ff;letter-spacing:.04em;text-transform:uppercase}
.mlabel b{color:var(--volt);font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:99px;background:#ffffff24;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
#progFill{background:linear-gradient(90deg,var(--teal),var(--sky))}
#pwrFill{background:linear-gradient(90deg,#ff9f1c,var(--volt));box-shadow:0 0 14px #ffd23faa}
.stars{font:700 1.5rem var(--f-display);color:var(--volt);display:flex;align-items:center;gap:.3rem;font-variant-numeric:tabular-nums}
.stars.pulse{animation:pop .5s}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:2px solid #ffffff44;background:#ffffff14;border-radius:99px;padding:.35em .9em;font:600 .95rem var(--f-display);color:var(--cream)}
.tbtn:hover{background:#ffffff2a}
.tbtn.armed{background:var(--coral);border-color:var(--coral)}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(240px,.34fr) minmax(0,.66fr);gap:clamp(14px,2.4vw,36px);align-items:start}
.max-col{display:flex;flex-direction:column;align-items:center;gap:18px}
.bubble{position:relative;background:var(--cream);color:var(--ink);border-radius:26px;padding:.9em 1.1em;font:600 clamp(1.15rem,1.7vw,1.6rem)/1.28 var(--f-display);width:100%;min-height:4.6em;display:flex;align-items:center;box-shadow:0 8px 0 #0c0a3a80}
.bubble.long{font-size:clamp(1rem,1.35vw,1.3rem)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-16px;border:16px solid transparent;border-top:20px solid var(--cream);border-bottom:0}
.bubble.pop{animation:pop .45s}
.bubble p{margin:0}
.max-wrap{width:clamp(150px,19vw,330px)}
#max{display:block;width:100%;height:auto;overflow:visible}
#max .bob{animation:bob 2.8s ease-in-out infinite}
#max .head{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s}
#max .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite;opacity:calc(.6 + .4*var(--e))}
#max .ant-ball{animation:glow 1.8s ease-in-out infinite alternate}
#max .core{opacity:calc(.25 + .75*var(--e));filter:drop-shadow(0 0 calc(2px + 14px*var(--e)) #ffd23f);transition:opacity .6s}
#max .bolt-mark{opacity:calc(.35 + .65*var(--e))}
#max .arm-r{transform-box:fill-box;transform-origin:0% 50%;animation:wave 3.2s ease-in-out infinite}
#max .arm-l{transform-box:fill-box;transform-origin:100% 50%}
#max .mouth-oops{opacity:0}
#max.oops .head{transform:rotate(-7deg)}
#max.oops .mouth-smile{opacity:0}
#max.oops .mouth-oops{opacity:1}
#max.happy .bob{animation:hop .5s ease 3}
#max.happy .arm-r{animation:wave .45s ease-in-out 4}
#max.happy .arm-l{animation:waveL .45s ease-in-out 4}
#max.think .head{transform:rotate(5deg)}
#max.dance .bob{animation:hop .7s ease infinite}
#max.dance .arm-r{animation:wave .5s ease-in-out infinite}
#max.dance .arm-l{animation:waveL .5s ease-in-out infinite}

/* ---------- cards ---------- */
.content{min-width:0}
.card{background:var(--cream);color:var(--ink);border-radius:30px;padding:clamp(16px,2.4vw,34px);box-shadow:0 10px 0 #0c0a3a80}
.intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:clamp(26px,5vw,60px)}
.intro .kicker{font:600 clamp(1.1rem,1.8vw,1.6rem) var(--f-display);color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin:0}
.intro h1{margin:0;font:700 clamp(2.6rem,6vw,5.6rem)/.95 var(--f-display);color:var(--ink);text-wrap:balance}
.intro h1 span{display:block;color:var(--coral)}
.intro .sub{margin:0;font:600 clamp(1.2rem,2vw,1.8rem) var(--f-display);color:var(--ink-soft)}
.teachnote{margin:0;font:700 .95rem var(--f-body);color:var(--ink-soft);max-width:34em}

.btn{border:0;border-radius:99px;padding:.65em 1.3em;font:700 clamp(1.05rem,1.5vw,1.35rem) var(--f-display);transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.main{background:var(--volt);color:var(--ink);box-shadow:0 6px 0 #c99a00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #cfc8ee;border:3px solid #e6e0fb}
.btn.go{background:var(--lime);color:#0f3d17;box-shadow:0 6px 0 #2f9e44}
.btn.go.ready{animation:nudge 1.1s ease-in-out infinite}
.btn.big{font-size:clamp(1.4rem,2.4vw,2.2rem);padding:.6em 1.6em}
.btn:not(:disabled):hover{transform:translateY(-2px)}

/* ---------- hub ---------- */
.hub-title{margin:0 0 14px;font:700 clamp(1.6rem,3vw,2.6rem)/1.1 var(--f-display);color:var(--cream);text-wrap:balance}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px}
.mcard{--c:var(--coral);position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;border:0;border-radius:28px;background:var(--cream);color:var(--ink);padding:16px;box-shadow:0 10px 0 #0c0a3a80;transition:transform .15s}
.mcard:not(:disabled):hover{transform:translateY(-4px)}
.mcard .art{height:clamp(90px,11vw,140px);border-radius:20px;background:var(--c);display:grid;place-items:center}
.mcard .art svg{height:78%;width:auto;max-width:90%}
.mcard .mnum{font:600 .9rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.mcard .mname{font:700 clamp(1.3rem,2vw,1.8rem)/1.1 var(--f-display)}
.mcard .mtag{font:700 1rem var(--f-body);color:var(--ink-soft)}
.mcard .mstat{margin-top:auto;font:700 1.05rem var(--f-display);padding:.4em .8em;border-radius:99px;background:#efeaff;align-self:flex-start}
.mcard.play{outline:5px solid var(--volt);animation:ring 1.6s ease-in-out infinite}
.mcard.play .mstat{background:var(--volt)}
.mcard.locked{opacity:.55;filter:grayscale(.7);cursor:not-allowed}
.mcard.complete{cursor:default}
.mcard.complete .mstat{background:#c9f6cc;color:#14501c}

/* ---------- question card ---------- */
.q-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.badge{background:var(--c);color:#fff;border-radius:99px;padding:.25em .9em;font:700 1rem var(--f-display)}
.qcount{font:600 1rem var(--f-display);color:var(--ink-soft)}
.prompt{margin:.5em 0 .6em;font:600 clamp(1.5rem,2.6vw,2.5rem)/1.15 var(--f-display);text-wrap:balance}
.q-vis{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.vis-row{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;width:100%}
.seq{display:flex;flex-wrap:wrap;gap:14px 4px;align-items:flex-start;min-width:0}
.unit{display:flex;align-items:flex-start}
.cell{--h:clamp(62px,7.6vw,112px);min-width:var(--h);height:var(--h);padding-inline:.35em;display:grid;place-items:center;border-radius:22px;background:#fff;border:4px solid var(--ink);font:700 clamp(1.7rem,3.6vw,3.3rem) var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;transition:background .2s,transform .2s}
.cell.d4{font-size:clamp(1.4rem,3vw,2.8rem)}
.cell.blank{border-style:dashed;background:#fff3c4;color:var(--ink-soft);animation:pulse 1.6s ease-in-out infinite}
.cell.blank.filled{background:#e3f1ff;color:var(--ink);animation:none;border-style:solid}
.cell.blank.active{outline:5px solid var(--volt);outline-offset:2px;animation:none}
.cell.blank.right{background:#c9f6cc;border-color:#2f9e44;border-style:solid;color:#14501c;animation:pop .5s}
.cell.blank.wrong{background:#ffd3d9;border-color:#c0304c;border-style:solid;animation:none}
.cell.shake{animation:shake .45s}
button.cell{cursor:pointer}
.jump{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:3.5rem;height:clamp(62px,7.6vw,112px);padding-inline:.15rem}
.jump b{background:var(--volt);color:var(--ink);padding:.05em .55em;border-radius:99px;font:700 1.05rem var(--f-display)}
.jump i{display:block;width:100%;height:3px;background:var(--ink-soft);position:relative;margin-top:.45rem;border-radius:2px}
.jump i::after{content:"";position:absolute;right:-2px;top:-6px;border:7px solid transparent;border-left:10px solid var(--ink-soft);border-right:0}

.cups{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end}
.cup{width:clamp(56px,6.4vw,92px);height:auto}
.cup.new{filter:drop-shadow(0 0 10px #ffb800);animation:bob 1.4s ease-in-out infinite}
.cup-cap{font:600 clamp(1.05rem,1.6vw,1.4rem) var(--f-display);color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:.3em .8em;align-items:center}
.cup-cap b{color:var(--ink);font-size:1.4em}
.cup-cap .plus{background:var(--volt);color:var(--ink);border-radius:99px;padding:.1em .7em}

.blocks{display:flex;flex-direction:column;gap:8px;background:#f1ecff;border-radius:20px;padding:12px 16px;min-width:0}
.bwrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.bgrp{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.bgrp:empty{display:none}
.bgrp i{display:block;border-radius:4px}
.bgrp.hun i{width:clamp(22px,2.4vw,34px);height:clamp(22px,2.4vw,34px);background:repeating-linear-gradient(0deg,#00000022 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,#00000022 0 1px,transparent 1px 10%),var(--grape)}
.bgrp.ten i{width:clamp(8px,.9vw,12px);height:clamp(30px,3.4vw,48px);background:repeating-linear-gradient(0deg,#00000030 0 1px,transparent 1px 10%),var(--teal)}
.bgrp.one i{width:clamp(8px,.9vw,12px);height:clamp(8px,.9vw,12px);background:var(--coral);border-radius:3px}
.thousand{padding:.3em 1em;border-radius:12px;background:linear-gradient(135deg,var(--grape),var(--coral));color:#fff;font:700 1.8rem var(--f-display)}
.blabel{font:700 clamp(.95rem,1.3vw,1.2rem) var(--f-body);color:var(--ink-soft)}
.blabel b{color:var(--ink);font-family:var(--f-display);font-size:1.2em}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(110px,15vw,200px),1fr));gap:14px;margin-top:18px}
.choices.txt{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.choice{--c:#f2476a;--cd:#b3243f;border:0;border-radius:24px;padding:.3em .2em;color:#fff;background:var(--c);box-shadow:0 8px 0 var(--cd);font:700 clamp(2rem,4.2vw,3.6rem) var(--f-display);font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s}
.choice.long{font-size:clamp(1.15rem,1.9vw,1.7rem);padding:.7em .6em}
.choice:nth-child(2){--c:#0a9b92;--cd:#06665f}
.choice:nth-child(3){--c:#7d4de8;--cd:#5128b3}
.choice:nth-child(4){--c:#2b8cf0;--cd:#1a5ab0}
.choice:not(:disabled):hover{transform:translateY(-3px)}
.choice[aria-pressed="true"]{transform:translateY(-5px);outline:6px solid var(--volt);outline-offset:2px}
.choice.tried{opacity:.3}
.choice.dim{opacity:.35}
.choice.right{--c:#2fb344;--cd:#1f7a2f;animation:pop .5s}
.choice.shake{animation:shake .45s}
.choice:disabled{cursor:default}

.tray{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:12px;margin-top:20px;padding:14px;border-radius:22px;background:#f1ecff}
.tray .lbl{width:100%;font:600 .95rem var(--f-display);color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.chip{--c:#7d4de8;--cd:#5128b3;border:0;border-radius:20px;padding:.25em .8em;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--cd);font:700 clamp(1.6rem,3vw,2.7rem) var(--f-display);font-variant-numeric:tabular-nums}
.chip:nth-child(even){--c:#0a9b92;--cd:#06665f}
.chip.used{opacity:.22}
.chip:not(:disabled):hover{transform:translateY(-2px)}

.chart{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:min(100%,54vh);min-width:min(100%,300px);margin:12px auto 0}
.chart button{aspect-ratio:1;border:0;border-radius:8px;background:#ebe6ff;color:var(--ink);font:700 clamp(.72rem,1.45vw,1.25rem) var(--f-display);font-variant-numeric:tabular-nums;padding:0;transition:background .15s,transform .1s}
.chart button:nth-child(20n+11),.chart button:nth-child(20n+12),.chart button:nth-child(20n+13),.chart button:nth-child(20n+14),.chart button:nth-child(20n+15),.chart button:nth-child(20n+16),.chart button:nth-child(20n+17),.chart button:nth-child(20n+18),.chart button:nth-child(20n+19),.chart button:nth-child(20n+20){background:#fbe9ef}
.chart button:not(:disabled):hover{transform:scale(1.08)}
.chart button.sel{background:var(--volt);box-shadow:0 0 0 3px var(--ink) inset}
.chart button.ok{background:#8ae28f;box-shadow:0 0 0 3px #1f7a2f inset}
.chart button.miss{background:#ffc2c9}
.chart button:disabled{cursor:default}

.fb{display:flex;gap:.7em;align-items:center;border-radius:18px;padding:.7em 1em;margin-top:16px;min-height:3.8em;font:700 clamp(1.05rem,1.6vw,1.4rem)/1.3 var(--f-body)}
.fb b{font-family:var(--f-display);white-space:nowrap}
.fb.hint{background:#fff1b8;color:#5a4300}
.fb.good{background:#d7f7da;color:#14501c}
.fb.reveal{background:#e2ecff;color:#17356b}
.fb.empty{color:transparent;background:transparent}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:16px;padding-top:16px;border-top:3px dashed #d9d2f5}
.ctl-label{font:600 .85rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.ctl-btns{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- finale ---------- */
.finale{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:clamp(24px,4vw,50px)}
.finale h2{margin:0;font:700 clamp(2.2rem,5vw,4.4rem)/1 var(--f-display);color:var(--ink);text-wrap:balance}
.finale h2 span{color:var(--coral)}
.fstars{font:700 clamp(1.6rem,3vw,2.6rem) var(--f-display);color:#b87d00}
.finale p{margin:0;font:600 clamp(1.2rem,2vw,1.8rem) var(--f-display);color:var(--ink-soft)}

/* ---------- city ---------- */
.city{position:relative;width:100%;aspect-ratio:900/200;max-height:27vh;min-height:110px;border-radius:30px;overflow:hidden;background:linear-gradient(#171446,#262270);box-shadow:0 10px 0 #0c0a3a80;margin-inline:auto}
.city::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 110%,#ffd23fcc,#ff9f1c55 40%,transparent 72%);opacity:calc(var(--e)*.85);transition:opacity .8s;pointer-events:none}
.city svg{position:relative;display:block;width:100%;height:100%;overflow:visible}
.city .ground{fill:#15123f}
.city .bld{fill:#2b2778;transition:fill .8s}
.city .win{fill:#3a3590;transition:fill .6s}
.city .win.lit{filter:drop-shadow(0 0 4px #ffd23f)}
.city .win.lit.c1{fill:#ffd23f}
.city .win.lit.c2{fill:#7ff3ea}
.city .win.lit.c3{fill:#ffb3c0}
.city.all .bld{fill:#3b36a4}
.city .lm{--lc:#4a45b0}
.city .lm *{transition:fill .8s,stroke .8s}
.city .lm-leg{stroke:var(--lc);stroke-width:4;fill:none}
.city .lm-ring{stroke:var(--lc);stroke-width:4;fill:none}
.city .lm-spoke{stroke:var(--lc);stroke-width:2}
.city .lm-gon{fill:#3a3590}
.city .lm-body{fill:#3a3590;stroke:var(--lc);stroke-width:3}
.city .lm-win{fill:#2b2778}
.city .lm-fin{fill:#3a3590}
.city .lm-pad{fill:#3a3590}
.city .lm-flame{fill:#ff9f1c;opacity:0}
.city .lm-beacon{fill:#3a3590}
.city .lm-beam{fill:#ffd23f;opacity:0}
.city .lm-cross{stroke:var(--lc);stroke-width:2}
.city .spin{transform-box:view-box}
#lmWheel.lit .spin{animation:spin 14s linear infinite}
#lmWheel.lit .lm-ring{stroke:var(--coral)}
#lmWheel.lit .lm-leg{stroke:#ffb3c0}
#lmWheel.lit .lm-spoke{stroke:#ffd23f}
#lmWheel.lit .lm-gon:nth-of-type(odd){fill:#ffd23f}
#lmWheel.lit .lm-gon:nth-of-type(even){fill:#7ff3ea}
#lmRocket.lit .lm-rk{animation:hover 2.2s ease-in-out infinite}
#lmRocket.lit .lm-body{fill:#fff7e0;stroke:#ffffff}
#lmRocket.lit .lm-win{fill:#58b6ff}
#lmRocket.lit .lm-fin{fill:var(--coral)}
#lmRocket.lit .lm-flame{opacity:1;animation:flicker .25s infinite alternate}
#lmTower.lit .lm-body{fill:#0a9b92;stroke:#7ff3ea}
#lmTower.lit .lm-beacon{fill:#ffd23f;filter:drop-shadow(0 0 10px #ffd23f)}

@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes glow{from{opacity:.7}to{opacity:1}}

@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

@keyframes nudge{50%{transform:translateY(-4px)}}
@keyframes ring{50%{outline-color:#fff0a0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hover{50%{transform:translateY(-8px)}}

    // Rocket on pad
    s += '<g id="lmRocket" class="lm"><rect class="lm-pad" x="520" y="186" width="60" height="6" rx="3"/><rect class="lm-fin" x="596" y="100" width="8" height="88"/><line class="lm-cross" x1="596" y1="120" x2="580" y2="130"/><line class="lm-cross" x1="596" y1="150" x2="580" y2="160"/>';
    s += '<g class="lm-rk"><path class="lm-flame" d="M541 184 Q550 208 559 184Z"/><path class="lm-fin" d="M530 150 L512 184 L530 178Z M570 150 L588 184 L570 178Z"/><path class="lm-body" d="M550 92 Q570 120 570 160 L570 184 L530 184 L530 160 Q530 120 550 92Z"/><circle class="lm-win" cx="550" cy="132" r="9"/></g></g>';
    // Power tower
    s += '<g id="lmTower" class="lm"><path class="lm-beam" d="M750 38 L700 0 L800 0Z"/><path class="lm-body" d="M732 190 L750 46 L768 190Z"/>';
    [170, 150, 130, 110, 90, 70].forEach(function (y) { var half = 3 + (y - 46) * 0.145; s += '<line class="lm-cross" x1="' + (750 - half).toFixed(1) + '" y1="' + y + '" x2="' + (750 + half).toFixed(1) + '" y2="' + y + '"/>'; });
    s += '<circle class="lm-beacon" cx="750" cy="38" r="11"/></g>';
    s += '</svg>';
    $('#city').innerHTML = s;
    cityWins = Array.prototype.slice.call(document.querySelectorAll('#city .win'));
  }
  function updateCity() {
    var total = state.done.reduce(function (a, b) { return a + b; }, 0);
    var n = Math.round(total / TOTAL * cityWins.length);
    cityWins.forEach(function (w) { w.classList.toggle('lit', +w.getAttribute('data-o') < n); });
    ['#lmWheel', '#lmRocket', '#lmTower'].forEach(function (id, i) {
      $(id).classList.toggle('lit', state.done[i] >= MISSIONS[i].qs.length);
    });
    $('#city').classList.toggle('all', state.screen === 'finale');
  }

  /* ---------------- header / HUD ---------------- */
  function missionComplete(i) { return state.done[i] >= MISSIONS[i].qs.length; }
  function unlocked(i) { return i === 0 || missionComplete(i - 1); }
  function nextMission() { for (var i = 0; i < MISSIONS.length; i++) if (!missionComplete(i)) return i; return -1; }

  function updateHUD() {
    var total = state.done.reduce(function (a, b) { return a + b; }, 0);
    var e = total / TOTAL;
    document.documentElement.style.setProperty('--e', e.toFixed(3));
    $('#pwrFill').style.width = (e * 100).toFixed(1) + '%';
    $('#pwrPct').textContent = Math.round(e * 100) + '%';
    var stars = state.stars.reduce(function (a, b) { return a + b; }, 0);
    $('#starCount').textContent = stars;
    var nm = nextMission();
    $('#pills').innerHTML = MISSIONS.map(function (M, i) {
      var cls = missionComplete(i) ? 'done' : (i === nm ? 'cur' : 'lock');
      return '<span class="pill ' + cls + '">' + (i + 1) + ' ' + M.short + '</span>';
    }).join('');
    if (state.screen === 'play') {
      var M = MISSIONS[state.m];
      $('#progLabel').textContent = 'Mission ' + (state.m + 1) + ' · ' + state.done[state.m] + '/' + M.qs.length;
      $('#progFill').style.width = (state.done[state.m] / M.qs.length * 100) + '%';
    } else {
      var c = MISSIONS.filter(function (_, i) { return missionComplete(i); }).length;
      $('#progLabel').textContent = 'Missions · ' + c + '/' + MISSIONS.length;
      $('#progFill').style.width = (c / MISSIONS.length * 100) + '%';
    }
    $('#btnMap').hidden = state.screen !== 'play';
    updateCity();
  }

  function showScreen(name) {
    state.screen = name;
    $('#sIntro').hidden = name !== 'intro';
    $('#sHub').hidden = name !== 'hub';
    $('#sPlay').hidden = name !== 'play';
    $('#sFinale').hidden = name !== 'finale';
    $('#max').classList.toggle('dance', name === 'finale');
  }

  /* ---------------- hub ---------------- */
  function iconSVG(kind) {
    if (kind === 'cup') return cupSVG(0, false);
    if (kind === 'rocket') return '<svg viewBox="0 0 60 80" aria-hidden="true"><path d="M30 6 Q44 26 44 52 L44 62 L16 62 L16 52 Q16 26 30 6Z" fill="#fff7e0"/><circle cx="30" cy="34" r="7" fill="#58b6ff"/><path d="M16 46 L4 66 L16 62Z M44 46 L56 66 L44 62Z" fill="#ffd23f"/><path d="M24 62 Q30 80 36 62Z" fill="#ff9f1c"/></svg>';
    return '<svg viewBox="0 0 80 70" aria-hidden="true"><rect x="6" y="34" width="16" height="30" rx="3" fill="#fff7e0"/><rect x="26" y="18" width="18" height="46" rx="3" fill="#fff7e0"/><rect x="48" y="30" width="16" height="34" rx="3" fill="#fff7e0"/><path d="M62 4 L50 24 H58 L54 40 L70 18 H60Z" fill="#ffd23f"/></svg>';
  }
  function renderHub() {
    var nm = nextMission();
    var h = '<h2 class="hub-title">Pick a mission, Number Heroes!</h2><div class="hub">';
    MISSIONS.forEach(function (M, i) {
      var comp = missionComplete(i), open = unlocked(i), cls, stat;
      if (comp) { cls = 'complete'; stat = '✓ Done · ★ ' + state.stars[i] + '/' + M.qs.length; }
      else if (!open) { cls = 'locked'; stat = 'Locked: finish Mission ' + i; }
      else { cls = 'play'; stat = state.done[i] > 0 ? 'Continue · ' + state.done[i] + '/' + M.qs.length : 'Play!'; }
      h += '<button class="mcard ' + cls + '" style="--c:' + M.color + '" data-act="mission" data-i="' + i + '"' + ((comp || !open) ? ' disabled' : '') + '>' +
        '<div class="art">' + iconSVG(M.icon) + '</div><div class="mnum">Mission ' + (i + 1) + '</div><div class="mname">' + M.name + '</div><div class="mtag">' + M.tag + '</div><div class="mstat">' + stat + '</div></button>';
    });
    $('#sHub').innerHTML = h + '</div>';
  }

  /* ---------------- question visuals ---------------- */
  function cupSVG(i, isNew) {
    var cols = ['#ffd23f', '#58b6ff', '#6bd66b', '#ff9bb0', '#b79bff'];
    var bowl = ['#ff6a7a', '#22c7bd', '#8d5bf5', '#58b6ff'][i % 4];
    var heads = '';
    for (var k = 0; k < 5; k++) heads += '<circle cx="' + (23 + k * 11) + '" cy="28" r="6" fill="' + cols[(k + i) % 5] + '"/>';
    return '<svg class="cup' + (isNew ? ' new' : '') + '" viewBox="0 0 100 84" aria-hidden="true">' + heads +
      '<path d="M12 36 H78 Q78 70 45 70 Q12 70 12 36Z" fill="' + bowl + '"/>' +
      '<path d="M78 42 Q96 42 92 55 Q89 64 76 60" fill="none" stroke="' + bowl + '" stroke-width="6" stroke-linecap="round"/>' +
      '<ellipse cx="45" cy="74" rx="34" ry="6" fill="#fff"/></svg>';
  }
  function ridesHTML(q) {
    var prev = q.seq[q.seq.length - 2], n = prev / 5, h = '<div class="cups" aria-hidden="true">';
    for (var i = 0; i < n; i++) h += cupSVG(i, false);
    h += cupSVG(n, true) + '</div>';
    h += '<div class="cup-cap"><span><b>' + prev + '</b> people on the ride</span><span class="plus">+ 5 getting on</span></div>';
    return h;
  }
  function blocksHTML(n) {
    if (n >= 1000) return '<div class="blocks"><div class="bwrap"><div class="thousand">1000</div></div><div class="blabel">10 hundreds make 1 thousand</div></div>';
    var H = Math.floor(n / 100), T = Math.floor(n % 100 / 10), O = n % 10;
    function rep(k) { var s = ''; for (var i = 0; i < k; i++) s += '<i></i>'; return s; }
    return '<div class="blocks"><div class="bwrap"><div class="bgrp hun">' + rep(H) + '</div><div class="bgrp ten">' + rep(T) + '</div><div class="bgrp one">' + rep(O) + '</div></div>' +
      '<div class="blabel"><b>' + n + '</b> = ' + H + ' hundred' + (H === 1 ? '' : 's') + ', ' + T + ' ten' + (T === 1 ? '' : 's') + ', ' + O + ' one' + (O === 1 ? '' : 's') + '</div></div>';
  }
  function blocksNumber(q, u) {
    if (u.status === 'done') {
      if (q.t === 'mc' && typeof q.answer === 'number') return q.answer;
      if (q.t === 'fill') return q.answers[0];
    }
    return q.blocks;
  }
  function seqHTML(q, u) {
    var done = u.status === 'done', bi = 0, h = '<div class="seq">';
    q.seq.forEach(function (v, i) {
      h += '<div class="unit">';
      if (i > 0 && q.step != null) h += '<div class="jump"><b>' + ((q.hideStep && !done) ? '?' : '+' + q.step) + '</b><i></i></div>';
      if (v !== null) {
        h += '<div class="cell given' + d4(v) + '">' + fmt(v) + '</div>';
      } else if (q.t === 'fill') {
        var idx = bi++, val = u.vals[idx], cls = 'cell blank', txt = val !== null ? fmt(val) : '?';
        if (val !== null) cls += ' filled';
        if (u.locked[idx]) cls += ' right';
        else if (u.bad[idx]) cls += ' wrong';
        if (!done && u.active === idx && !u.locked[idx]) cls += ' active';
        if (u.flash && u.flash.wrong && u.flash.wrong.indexOf(idx) >= 0) cls += ' shake';
        h += '<button class="' + cls + d4(txt) + '" data-act="blank" data-i="' + idx + '"' + (done ? ' disabled' : '') + ' aria-label="Blank ' + (idx + 1) + '">' + txt + '</button>';
      } else {
        var c2 = 'cell blank', t2 = '?';
        if (done) { t2 = fmt(q.answer); c2 += ' right'; }
        else if (u.sel !== null) { t2 = fmt(q.choices[u.sel]); c2 += ' filled'; }
        h += '<div class="' + c2 + d4(t2) + '">' + t2 + '</div>';
      }
      h += '</div>';
    });
    return h + '</div>';
  }
  function visHTML(q, u) {
    if (q.t === 'chart' || !q.seq) return '';
    var h = '';
    if (q.ride) h += ridesHTML(q);
    if (q.blocks != null) h += '<div class="vis-row">' + seqHTML(q, u) + blocksHTML(blocksNumber(q, u)) + '</div>';
    else h += seqHTML(q, u);
    return h;
  }
  function answerHTML(q, u) {
    var done = u.status === 'done', h = '';
    if (q.t === 'mc') {
      var txt = typeof q.choices[0] === 'string';
      h += '<div class="choices' + (txt ? ' txt' : '') + '">';
      q.choices.forEach(function (c, i) {
        var cls = 'choice' + (txt ? ' long' : '');
        if (u.tried[i]) cls += ' tried';
        if (done) cls += (c === q.answer ? ' right' : ' dim');
        if (u.flash && u.flash.choice === i) cls += ' shake';
        h += '<button class="' + cls + '" data-act="choice" data-ci="' + i + '" aria-pressed="' + (u.sel === i) + '"' + ((done || u.tried[i]) ? ' disabled' : '') + '>' + fmt(c) + '</button>';
      });
      h += '</div>';
    } else if (q.t === 'fill') {
      h += '<div class="tray"><span class="lbl">Tap a blank, then tap a number</span>';
      q.tray.forEach(function (v, i) {
        var used = u.vals.indexOf(v) >= 0;
        h += '<button class="chip' + (used ? ' used' : '') + '" data-act="chip" data-vi="' + i + '"' + ((done || used) ? ' disabled' : '') + '>' + fmt(v) + '</button>';
      });
      h += '</div>';
    } else if (q.t === 'chart') {
      h += '<div class="chart" role="group" aria-label="Number chart 1 to 100">';
      for (var n = 1; n <= 100; n++) {
        var cls = '', isT = q.targets.indexOf(n) >= 0, isP = u.picked[n];
        if (done) { if (isT) cls = 'ok'; else if (isP) cls = 'miss'; }
        else if (isP) cls = 'sel';
        h += '<button class="' + cls + '" data-act="cell" data-n="' + n + '"' + (done ? ' disabled' : '') + ' aria-pressed="' + (!!isP) + '">' + n + '</button>';
      }
      h += '</div>';
    }
    return h;
  }
  function fbHTML(q, u) {
    if (u.status === 'done') return '<div class="fb ' + (u.revealed ? 'reveal' : 'good') + '"><b>' + (u.revealed ? 'Answer' : 'Yes!') + '</b><span>' + q.why + '</span></div>';
    if (u.fb) return '<div class="fb hint"><b>Hint</b><span>' + u.fb + '</span></div>';
    return '<div class="fb empty">&nbsp;</div>';
  }
  function canCheck(q, u) {
    if (q.t === 'mc') return u.sel !== null;
    if (q.t === 'fill') return u.vals.every(function (v) { return v !== null; });
    return Object.keys(u.picked).length > 0;
  }
  function controlsHTML(q, u) {
    var done = u.status === 'done', M = MISSIONS[state.m], last = state.qi[state.m] === M.qs.length - 1;
    return '<div class="controls"><span class="ctl-label">Teacher controls</span><div class="ctl-btns">' +
      '<button class="btn ghost" data-act="hint"' + (done ? ' disabled' : '') + '>Show Hint</button>' +
      '<button class="btn main" data-act="check"' + ((done || !canCheck(q, u)) ? ' disabled' : '') + '>Check Answer</button>' +
      '<button class="btn ghost" data-act="reveal"' + (done ? ' disabled' : '') + '>Reveal Answer</button>' +
      '<button class="btn go' + (done ? ' ready' : '') + '" data-act="next"' + (done ? '' : ' disabled') + '>' + (last ? 'Finish Mission' : 'Next Question') + '</button></div></div>';
  }

  function cq() { return MISSIONS[state.m].qs[state.qi[state.m]]; }
  function newUI(q) {
    return {
      sel: null, tried: {}, picked: {}, found: null, attempts: 0, status: 'answering', revealed: false, fb: null, flash: null,
      vals: q.t === 'fill' ? q.answers.map(function () { return null; }) : [],
      locked: {}, bad: {}, active: 0
    };
  }
  function renderPlay() {
    var M = MISSIONS[state.m], q = cq(), u = state.ui;
    var h = '<div class="q-top"><span class="badge" style="--c:' + M.color + '">Mission ' + (state.m + 1) + ' · ' + M.short + '</span><span class="qcount">Question ' + (state.qi[state.m] + 1) + ' of ' + M.qs.length + '</span></div>';
    h += '<h2 class="prompt">' + q.prompt + '</h2>';
    var v = visHTML(q, u);
    if (v) h += '<div class="q-vis">' + v + '</div>';
    h += answerHTML(q, u) + fbHTML(q, u) + controlsHTML(q, u);
    $('#sPlay').innerHTML = h;
    u.flash = null;
  }

  /* ---------------- game flow ---------------- */
  function loadQuestion() {
    var q = cq();
    state.ui = newUI(q);
    showScreen('play');
    renderPlay();
    say(state.qi[state.m] === 0 ? MISSIONS[state.m].intro : (q.say || pick(STARTS)), 'think');
    updateHUD();
  }
  function startMission(i) {
    if (!unlocked(i) || missionComplete(i)) return;
    state.m = i; state.qi[i] = state.done[i];
    loadQuestion();
  }
  function finishQ(revealed) {
    var u = state.ui, q = cq(), m = state.m;
    u.status = 'done'; u.revealed = revealed; u.fb = null;
    if (q.t === 'fill') { u.vals = q.answers.slice(); u.locked = {}; u.bad = {}; q.answers.forEach(function (_, i) { u.locked[i] = true; }); }
    state.done[m]++;
    if (!revealed && u.attempts === 0) {
      state.stars[m]++;
      var st = $('#stars'); st.classList.remove('pulse'); void st.offsetWidth; st.classList.add('pulse');
    }
    if (revealed) sfx.reveal(); else { sfx.correct(); say(pick(CHEERS), 'happy'); }
    updateHUD();
    renderPlay();
  }
  function revealNow(auto) {
    var u = state.ui;
    if (u.status !== 'answering') return;
    if (!auto) say('Here is the answer. Let’s see why!', 'think');
    finishQ(true);
  }
  function wrongTry() {
    var q = cq(), u = state.ui;
    u.attempts++;
    sfx.wrong();
    if (u.attempts >= 2) { say('That’s okay! Let’s learn it together.', 'oops'); finishQ(true); return; }
    var lead = (q.t === 'chart' && u.found != null) ? 'You found ' + u.found + ' of ' + q.targets.length + '. ' : 'Good try! ';
    u.fb = lead + q.hint;
    say(pick(OOPS), 'oops');
    renderPlay();
  }
  function check() {
    var q = cq(), u = state.ui;
    if (u.status !== 'answering' || !canCheck(q, u)) return;
    var ok = false;
    u.flash = {};
    if (q.t === 'mc') {
      ok = q.choices[u.sel] === q.answer;
      if (!ok) { u.tried[u.sel] = true; u.flash.choice = u.sel; u.sel = null; }
    } else if (q.t === 'fill') {
      var wrong = [];
      u.vals.forEach(function (v, i) { if (v === q.answers[i]) u.locked[i] = true; else { wrong.push(i); u.bad[i] = true; } });
      ok = wrong.length === 0;
      if (!ok) { u.flash.wrong = wrong; u.active = wrong[0]; }
    } else {
      var picked = Object.keys(u.picked).map(Number);
      var good = picked.filter(function (n) { return q.targets.indexOf(n) >= 0; });
      ok = good.length === q.targets.length && picked.length === q.targets.length;
      if (!ok) { u.picked = {}; good.forEach(function (n) { u.picked[n] = true; }); u.found = good.length; }
    }
    if (ok) finishQ(false); else wrongTry();
  }
  function next() {
    var u = state.ui;
    if (!u || u.status !== 'done') return;
    var m = state.m;
    state.qi[m]++;
    if (state.qi[m] >= MISSIONS[m].qs.length) { completeMission(m); return; }
    loadQuestion();
  }
  function completeMission(m) {
    state.ui = null;
    if (state.done.every(function (d, i) { return d >= MISSIONS[i].qs.length; })) { finale(); return; }
    showScreen('hub'); renderHub(); updateHUD();
    sfx.unlock(); say(MISSIONS[m].win, 'happy'); confetti(50);
  }
  function finale() {
    showScreen('finale');
    var stars = state.stars.reduce(function (a, b) { return a + b; }, 0);
    $('#sFinale').innerHTML = '<h2>Number City is <span>shining!</span></h2><div class="fstars">★ ' + stars + ' first-try stars out of ' + TOTAL + '</div><p>Max is fully charged. Thank you, heroes!</p><button class="btn main big" data-act="restart">Play Again</button>';
    updateHUD();
    say(FINAL_MSG, 'happy');
    sfx.win(); confetti(150);
  }
  function restart() {
    state = fresh(state.muted);
    clearTimeout(armTimer);
    $('#btnRestart').textContent = 'Restart'; $('#btnRestart').classList.remove('armed');
    $('#confetti').innerHTML = '';
    showScreen('intro'); updateHUD();
    say(INTRO_MSG, 'happy');
  }

  /* ---------------- confetti ---------------- */
  function confetti(n) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = $('#confetti'), cols = ['#ffd23f', '#f2476a', '#22c7bd', '#8d5bf5', '#58b6ff', '#6bd66b'];
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span'), w = 7 + Math.random() * 8;
      s.style.cssText = 'left:' + (Math.random() * 100) + '%;width:' + w + 'px;height:' + (w * 1.6) + 'px;background:' + pick(cols) + ';animation-duration:' + (2.6 + Math.random() * 2.8) + 's;animation-delay:' + (Math.random() * 1.2) + 's';
      box.appendChild(s);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 7500); })(s);
    }
  }

  /* ---------------- events ---------------- */
  function placeChip(q, u, val) {
    var idx = u.active;
    if (idx == null || u.locked[idx]) idx = u.vals.findIndex(function (v, i) { return v === null && !u.locked[i]; });
    if (idx < 0) return;
    u.vals[idx] = val; delete u.bad[idx];
    var nxt = u.vals.findIndex(function (v, i) { return v === null && !u.locked[i]; });
    u.active = nxt < 0 ? idx : nxt;
  }
  $('#sPlay').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    var a = t.getAttribute('data-act'), q = cq(), u = state.ui;
    if (!u) return;
    if (u.status === 'done' && a !== 'next') return;
    if (a === 'choice') { var ci = +t.getAttribute('data-ci'); u.sel = (u.sel === ci) ? null : ci; sfx.click(); renderPlay(); }
    else if (a === 'blank') {
      var bi = +t.getAttribute('data-i');
      if (u.locked[bi]) return;
      if (u.vals[bi] !== null) { u.vals[bi] = null; delete u.bad[bi]; }
      u.active = bi; sfx.click(); renderPlay();
    }
    else if (a === 'chip') { placeChip(q, u, q.tray[+t.getAttribute('data-vi')]); sfx.click(); renderPlay(); }
    else if (a === 'cell') { var n = +t.getAttribute('data-n'); if (u.picked[n]) delete u.picked[n]; else u.picked[n] = true; sfx.click(); renderPlay(); }
    else if (a === 'hint') { u.fb = q.hint; sfx.hint(); say('Here is a clue!', 'think'); renderPlay(); }
    else if (a === 'check') check();
    else if (a === 'reveal') revealNow(false);
    else if (a === 'next') next();
  });
  $('#sHub').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act="mission"]');
    if (t && !t.disabled) { actx(); sfx.click(); startMission(+t.getAttribute('data-i')); }
  });
  $('#sFinale').addEventListener('click', function (e) { if (e.target.closest('[data-act="restart"]')) { actx(); restart(); } });
  $('#btnStart').addEventListener('click', function () {
    actx(); sfx.unlock();
    showScreen('hub'); renderHub(); updateHUD();
    say('Pick Mission 1 to begin!', 'happy');
  });
  $('#btnMap').addEventListener('click', function () {
    state.ui = null; showScreen('hub'); renderHub(); updateHUD();
    say('Pick a mission, heroes!', 'think');
  });
  $('#btnMute').addEventListener('click', function () {
    state.muted = !state.muted;
    this.textContent = 'Sound: ' + (state.muted ? 'off' : 'on');
    this.setAttribute('aria-pressed', String(state.muted));
    if (!state.muted) { actx(); sfx.click(); }
  });
  $('#btnRestart').addEventListener('click', function () {
    var b = this;
    if (!state.armed) {
      state.armed = true; b.textContent = 'Tap again to restart'; b.classList.add('armed');
      armTimer = setTimeout(function () { state.armed = false; b.textContent = 'Restart'; b.classList.remove('armed'); }, 3500);
    } else { restart(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || state.screen !== 'play' || !state.ui) return;
    if (e.target && e.target.tagName === 'BUTTON') return;
    if (state.ui.status === 'done') next(); else check();
  });

  /* ---------------- start ---------------- */
  buildCity();
  showScreen('intro');
  updateHUD();
  say(INTRO_MSG, 'happy');
})();
</script>

</body></html>
